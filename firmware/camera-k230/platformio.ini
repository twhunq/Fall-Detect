; Thiet bi giam sat: ESP32-S3-DevKitC-1 N16R8 lam cau noi cho camera K230.
[platformio]
default_envs = camera_bridge

[env:camera_bridge]
platform = espressif32@6.7.0
framework = arduino
board = esp32-s3-devkitc-1

; qio_opi = flash QIO + PSRAM Octal. Sai gia tri nay thi board treo luc khoi dong.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Serial xuat qua cong ghi "UART" tren DevKitC-1 (chip USB-UART), khong phai
; cong USB native. Muon dung USB native thi doi ca hai gia tri duoi thanh 1.
; DEVICE_TYPE=2: camera (byte loai may trong goi quang ba BLE).
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
  -DDEVICE_TYPE=2

; Thu vien BLE nam san trong framework; "deep+" de LDF lan ra BLE2902.h
; nam trong ble_alert.h.
lib_ldf_mode = deep+

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Nap that bai / mat ket noi giua chung thi ha xuong 115200.
upload_speed = 460800
